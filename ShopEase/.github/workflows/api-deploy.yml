name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/api-deploy.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ShopEase.Api/ShopEase.Api.csproj

      - name: Build
        run: dotnet build ShopEase.Api/ShopEase.Api.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/ShopEase.Api.Tests/ShopEase.Api.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish API
        run: dotnet publish ShopEase.Api/ShopEase.Api.csproj --configuration Release --no-build --output ../publish

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Backend/tests/ShopEase.Api.Tests/TestResults/test-results.trx

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: shopease-capstone--api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
